{% extends "streaming/base.html" %}

{% block content %}
<section class="card login-card">
    <h2>Sign In</h2>
    <p>Enter your name to continue to the camera.</p>

    {% if error %}
        <p class="message error">{{ error }}</p>
    {% endif %}

    <form method="post" class="login-form">
        {% csrf_token %}
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            maxlength="64"
            autocomplete="username"
            required
            autofocus
        >
        <button type="submit" class="primary-button">Continue</button>
    </form>
</section>
{% endblock %}
